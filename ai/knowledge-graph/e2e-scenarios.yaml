# E2E scenarios for NEUROGLYPHS (concept v2).
# Each scenario describes a user-visible flow and how to verify it.
# Determinism is covered by npm test; everything else is manual for now.
# Update this file whenever behavior or flows change.

scenarios:
  - id: boot
    name: Game boots and renders a seeded world
    steps:
      - Run npm run dev
      - Open the printed URL in a browser
    expected:
      - Page loads without console errors
      - A 3D world of glyph sprites is visible (thousands of characters, formulas, symbols)
      - Camera responds to input
      - No solid meshes or image textures anywhere, only glyphs

  - id: seed-determinism
    name: The same seed always rebuilds the same world
    steps:
      - Open the page with seed=abc123, note the structure and where the exit sits
      - Reload the same URL
      - Open the page with seed=xyz789
    expected:
      - The reloaded world is identical (same geometry, same exit position)
      - The other seed produces a visibly different structure
      - npm test passes the automated determinism checks

  - id: exit-portal
    name: Every world has exactly one findable exit
    steps:
      - Load any seed and look around the world
    expected:
      - Exactly one exit exists
      - It is a rectangular frame with a shaped hole in the middle
      - It is visually distinct from the structure (glowing) and reachable

  - id: music-reactivity
    name: Visuals pulse with the music
    status: planned-T04-T05
    steps:
      - Load a world, then load an audio file (or let the built-in generator run)
    expected:
      - Pulsation follows the beat, colour and motion follow frequency and mood
      - With no audio file loaded, the built-in generator keeps the world alive
      - Nothing in the world can kill the player or end the run

  - id: world-transition
    name: Going through the exit re-seeds into the next world
    status: planned-T07
    steps:
      - Fly into the exit portal
    expected:
      - Dissolve animation, then a new world built from the updated seed
      - Filling the hole correctly leads to a curated seed, ignoring it leads to a random one
      - Returning to a previous seed shows the same anchors with new details

  - id: performance
    name: The world stays at 60fps
    steps:
      - Load a default world (5000+ glyphs)
      - Move the camera around for 30 seconds
    expected:
      - FPS stays at or above 55 on integrated GPU
      - No visible stutter or memory growth (check the DevTools memory tab)
