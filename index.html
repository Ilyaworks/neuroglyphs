<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEUROGLYPHS</title>
  <style>
    :root {
      --bg: #05060a;
      --fg: #cfe8ff;
      --accent: #58e6d0;
      --dim: #5b6b80;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
    #scene { position: fixed; inset: 0; display: block; }
    .hud {
      position: fixed;
      font-family: "Consolas", "SF Mono", "Menlo", monospace;
      color: var(--fg);
      pointer-events: none;
      user-select: none;
      z-index: 10;
    }
    #hud-top {
      top: 22px; left: 26px;
    }
    #hud-top h1 {
      font-size: 22px;
      letter-spacing: 6px;
      font-weight: 700;
      color: var(--accent);
      text-shadow: 0 0 18px rgba(88, 230, 208, 0.45);
    }
    #hud-top .sub {
      margin-top: 6px;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--dim);
      text-transform: uppercase;
    }
    #hud-stats {
      top: 22px; right: 26px;
      text-align: right;
      font-size: 12px;
      line-height: 1.9;
      letter-spacing: 1px;
    }
    #hud-stats .row { display: flex; gap: 14px; justify-content: flex-end; }
    #hud-stats .k { color: var(--dim); min-width: 84px; text-align: left; }
    #hud-stats .v { color: var(--fg); min-width: 60px; text-align: right; }
    #hud-stats .v.accent { color: var(--accent); }
    #hud-bottom {
      bottom: 20px; left: 26px;
      font-size: 10px;
      letter-spacing: 1.5px;
      color: var(--dim);
      text-transform: uppercase;
    }
    #hud-bottom b { color: var(--fg); font-weight: 600; }
    #context-bar {
      position: fixed;
      bottom: 46px; left: 26px;
      width: 260px; height: 8px;
      border: 1px solid rgba(88, 230, 208, 0.35);
      background: rgba(255, 255, 255, 0.03);
      z-index: 10;
    }
    #context-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2b6f66, var(--accent));
      box-shadow: 0 0 12px rgba(88, 230, 208, 0.6);
      transition: width 0.25s linear;
    }
    #boot {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: var(--dim);
      font-family: monospace;
      font-size: 13px;
      letter-spacing: 3px;
      z-index: 20;
      background: var(--bg);
    }
    #boot.err { color: #ff7a7a; }
    .fade { opacity: 0 !important; transition: opacity 0.6s ease; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <div class="hud" id="hud-top">
    <h1>NEUROGLYPHS</h1>
    <div class="sub">glyph-field exploration &middot; v0.1</div>
  </div>

  <div class="hud" id="hud-stats">
    <div class="row"><span class="k">TOKENS</span><span class="v accent" id="s-tokens">0</span></div>
    <div class="row"><span class="k">CONTEXT</span><span class="v" id="s-context">0 / 2048</span></div>
    <div class="row"><span class="k">GLYPHS</span><span class="v" id="s-glyphs">0</span></div>
    <div class="row"><span class="k">FPS</span><span class="v" id="s-fps">--</span></div>
  </div>

  <div id="context-bar"><div id="context-fill"></div></div>

  <div class="hud" id="hud-bottom">
    <b>drag</b> orbit &nbsp;&middot;&nbsp; <b>scroll</b> zoom &nbsp;&middot;&nbsp; <b>space</b> pulse
  </div>

  <div id="boot">INITIALIZING GLYPH FIELD&hellip;</div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
