<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEUROGLYPHS — Shape Catalog Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #0ff; font-family: 'Courier New', monospace; }
    #hud {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 10px 16px;
      background: rgba(0,0,0,0.75);
      border-bottom: 1px solid #0ff4;
      z-index: 10;
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    #hud label { font-size: 12px; color: #0ff8; }
    #hud select {
      background: #001; color: #0ff; border: 1px solid #0ff5;
      padding: 4px 8px; font-family: inherit; font-size: 13px;
    }
    #hud button {
      background: #001; color: #0ff; border: 1px solid #0ff5;
      padding: 4px 12px; font-family: inherit; font-size: 13px; cursor: pointer;
    }
    #hud button:hover { background: #0ff2; }
    #hud .info { font-size: 11px; color: #0ff6; margin-left: auto; }
    #family {
      position: fixed; bottom: 10px; left: 16px;
      font-size: 11px; color: #0ff5; z-index: 10;
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="hud">
    <label>Форма:</label>
    <select id="shapeSelect"></select>
    <button id="prevBtn">← Пред.</button>
    <button id="nextBtn">След. →</button>
    <button id="autoBtn">Авто: ВКЛ</button>
    <span class="info" id="info"></span>
  </div>
  <div id="family"></div>

  <script type="module">
    import * as THREE from 'three';
    import { SHAPES, SHAPE_KEYS } from './shapeCatalog.js';

    const FAMILIES = [
      { name: 'Фракталы и хаос', keys: ['mandelShell','juliaCloud','lozengeAttractor','roesslerRibbon'] },
      { name: 'Спирали и винты', keys: ['logSpiral','doubleHelix','galacticArms','vortexEye'] },
      { name: 'Многогранники', keys: ['tetraWire','octaFrame','icoLattice','geoDome'] },
      { name: 'Космос', keys: ['nebulaPillars','blackHoleDisc','cometTail','pulsarBeams'] },
      { name: 'Рельеф', keys: ['mountainRidge','canyonWalls','sandDunes','crystalSpires'] },
      { name: 'Архитектура', keys: ['colonnadeRing','domeShell','archBridge','ziggurat'] },
      { name: 'Поверхности', keys: ['hyperbolicSaddle','mobiusStrip','kleinBottle','waveMembrane'] },
      { name: 'Решётки', keys: ['cubeLattice','hexGrid','voronoiCells','layeredPlates'] },
    ];

    const COUNT = 5000;
    const PARAMS = {
      radius: 60, flatten: 0.8, distPow: 0.8, tubeR: 10,
      arms: 4, twist: 4, spread: 0.6, thickness: 8,
      strands: 3, turns: 4, clusterCount: 6, clusterRadius: 12,
      freq: 0.3, amp: 8, knotP: 3, knotQ: 4
    };

    // renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.003);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 30, 120);

    // glyph texture
    function makeGlyphTexture() {
      const size = 64;
      const cvs = document.createElement('canvas');
      cvs.width = cvs.height = size;
      const ctx = cvs.getContext('2d');
      ctx.fillStyle = '#0ff';
      ctx.font = 'bold 48px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const glyphs = 'λΣΩπ∞ΨΦΔΘΛΞΨΩμπνξζ';
      const g = glyphs[Math.floor(Math.random() * glyphs.length)];
      ctx.fillText(g, size / 2, size / 2);
      const tex = new THREE.CanvasTexture(cvs);
      tex.needsUpdate = true;
      return tex;
    }

    // point cloud
    const positions = new Float32Array(COUNT * 3);
    const colors = new Float32Array(COUNT * 3);
    const sizes = new Float32Array(COUNT);

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

    const mat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uTexture: { value: makeGlyphTexture() },
      },
      vertexShader: `
        attribute float size;
        attribute vec3 color;
        varying vec3 vColor;
        void main() {
          vColor = color;
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = size * (300.0 / -mv.z);
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: `
        uniform sampler2D uTexture;
        uniform float uTime;
        varying vec3 vColor;
        void main() {
          vec4 t = texture2D(uTexture, gl_PointCoord);
          if (t.a < 0.1) discard;
          gl_FragColor = vec4(vColor, 1.0);
        }
      `,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
    });

    const points = new THREE.Points(geo, mat);
    scene.add(points);

    // ambient light for any future meshes
    scene.add(new THREE.AmbientLight(0x001122));

    // fill shape
    let currentIdx = 0;
    let autoPlay = true;
    let autoTimer = 0;
    const AUTO_INTERVAL = 4; // seconds

    function fillShape(key) {
      const fn = SHAPES[key];
      if (!fn) return;
      for (let i = 0; i < COUNT; i++) {
        const o = [0, 0, 0];
        fn(i, PARAMS, o);
        positions[i * 3] = o[0];
        positions[i * 3 + 1] = o[1];
        positions[i * 3 + 2] = o[2];

        // color based on position
        const d = Math.sqrt(o[0]*o[0] + o[1]*o[1] + o[2]*o[2]);
        const t = Math.min(1, d / 80);
        colors[i * 3] = 0.1 + t * 0.4;       // R
        colors[i * 3 + 1] = 0.5 + t * 0.5;   // G
        colors[i * 3 + 2] = 0.8 + t * 0.2;   // B

        sizes[i] = 1.5 + Math.random() * 1.5;
      }
      geo.attributes.position.needsUpdate = true;
      geo.attributes.color.needsUpdate = true;
      geo.attributes.size.needsUpdate = true;

      // update UI
      const sel = document.getElementById('shapeSelect');
      sel.value = key;
      const fam = FAMILIES.find(f => f.keys.includes(key));
      document.getElementById('family').textContent = fam ? fam.name : '';
      document.getElementById('info').textContent = `${key}  ·  ${SHAPE_KEYS.indexOf(key) + 1}/${SHAPE_KEYS.length}`;
    }

    // populate select
    const sel = document.getElementById('shapeSelect');
    SHAPE_KEYS.forEach((k, idx) => {
      const opt = document.createElement('option');
      opt.value = k;
      opt.textContent = k;
      sel.appendChild(opt);
    });

    sel.addEventListener('change', () => {
      currentIdx = SHAPE_KEYS.indexOf(sel.value);
      fillShape(sel.value);
      autoTimer = 0;
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      currentIdx = (currentIdx - 1 + SHAPE_KEYS.length) % SHAPE_KEYS.length;
      fillShape(SHAPE_KEYS[currentIdx]);
      autoTimer = 0;
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      currentIdx = (currentIdx + 1) % SHAPE_KEYS.length;
      fillShape(SHAPE_KEYS[currentIdx]);
      autoTimer = 0;
    });

    document.getElementById('autoBtn').addEventListener('click', (e) => {
      autoPlay = !autoPlay;
      e.target.textContent = autoPlay ? 'Авто: ВКЛ' : 'Авто: ВЫКЛ';
    });

    // keyboard
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        currentIdx = (currentIdx + 1) % SHAPE_KEYS.length;
        fillShape(SHAPE_KEYS[currentIdx]);
        autoTimer = 0;
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        currentIdx = (currentIdx - 1 + SHAPE_KEYS.length) % SHAPE_KEYS.length;
        fillShape(SHAPE_KEYS[currentIdx]);
        autoTimer = 0;
      }
    });

    // resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // animate
    let lastTime = 0;
    function animate(time) {
      requestAnimationFrame(animate);
      const dt = (time - lastTime) / 1000;
      lastTime = time;

      mat.uniforms.uTime.value = time / 1000;

      // slow auto-rotate
      points.rotation.y += dt * 0.15;

      // auto-advance
      if (autoPlay) {
        autoTimer += dt;
        if (autoTimer >= AUTO_INTERVAL) {
          autoTimer = 0;
          currentIdx = (currentIdx + 1) % SHAPE_KEYS.length;
          fillShape(SHAPE_KEYS[currentIdx]);
        }
      }

      renderer.render(scene, camera);
    }

    // init
    fillShape(SHAPE_KEYS[0]);
    requestAnimationFrame(animate);
  </script>
</body>
</html>
