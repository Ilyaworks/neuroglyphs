<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>проба пола — отражение</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
  #scene { display: block; width: 100vw; height: 100vh; }
  #hint {
    position: fixed; left: 12px; top: 12px; z-index: 2;
    font: 12px/1.6 ui-monospace, Consolas, monospace; color: #9fd;
    background: rgba(0,0,0,.6); padding: 9px 11px; border: 1px solid #2a5;
    white-space: pre; pointer-events: none;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="hint">ПРОБА ПОЛА
кликните по картинке — мышь начнёт вращать взгляд
W A S D — идти, пробел / C — выше и ниже, Shift — быстрее
Esc — отпустить курсор

вы стоите НА полу; над вами прямоугольник и столб
в полу под ними должны быть их отражения</div>

<script type="module">
// Проба отражающего пола. Отдельная сцена: только пол и несколько предметов над
// ним. Смысл — увидеть отражение однозначно. В поле из тысяч глифов ошибку в
// отражении не разглядеть, а здесь либо предмет отражается, либо нет.
//
// Открывать: http://localhost:5173/tools/floor-probe.html
//
// Способ отражения — зеркальные копии предметов под плоскостью пола, а не второй
// проход рендера в текстуру. Проход в текстуру пробовался первым: материал пола
// читает ту самую текстуру, в которую идёт рисование, драйвер видит петлю
// (Feedback loop formed between Framebuffer and active Texture) и молча
// выбрасывает ВСЕ отрисовки прохода. Снаружи это выглядит как «зеркало пустое».
// Копии такой петли не создают и честно отражают геометрию.
import * as THREE from "three";
import { createFlyCam } from "../src/player/flycam.js";

const canvas = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x05070c, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05070c, 0.0016);

const FLOOR_Y = 0;
const EYE = 6;

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 4000);
// Появляемся НА полу: глаза на человеческой высоте над плоскостью.
camera.position.set(0, FLOOR_Y + EYE, 120);

// ── предметы над полом ──────────────────────────────────────────────────────
// Всё, что должно отражаться, кладётся в эту группу: у неё потом появится
// зеркальный близнец.
const above = new THREE.Group();
scene.add(above);

// Прямоугольник. Грани разного цвета: по ним видно, не перепутаны ли в отражении
// верх с низом. Верхняя грань жёлтая, нижняя зелёная — в полу жёлтой быть не
// должно, там должна оказаться зелёная.
const box = new THREE.Mesh(
  new THREE.BoxGeometry(40, 24, 16),
  [
    new THREE.MeshBasicMaterial({ color: 0xff3b3b }), // +X правая, красная
    new THREE.MeshBasicMaterial({ color: 0x2f6bff }), // -X левая, синяя
    new THREE.MeshBasicMaterial({ color: 0xffe14d }), // +Y верх, жёлтая
    new THREE.MeshBasicMaterial({ color: 0x18c964 }), // -Y низ, зелёная
    new THREE.MeshBasicMaterial({ color: 0xff8ad4 }), // +Z к зрителю, розовая
    new THREE.MeshBasicMaterial({ color: 0x9b6bff }), // -Z от зрителя, фиолетовая
  ],
);
box.position.set(0, FLOOR_Y + 30, 0);
above.add(box);

// Рёбра прямоугольника — про них и просили: в полу должны читаться именно грани.
const edges = new THREE.LineSegments(
  new THREE.EdgesGeometry(box.geometry),
  new THREE.LineBasicMaterial({ color: 0xffffff }),
);
edges.position.copy(box.position);
above.add(edges);

// Столб сбоку: по нему сразу видно, что отражение вытянуто ВНИЗ, а не вбок.
const post = new THREE.Mesh(
  new THREE.BoxGeometry(4, 70, 4),
  new THREE.MeshBasicMaterial({ color: 0x00e5ff }),
);
post.position.set(-70, FLOOR_Y + 35, -30);
above.add(post);

// Ещё предмет подальше — проверить, что отражение не «прилипло» к одному месту.
const far = new THREE.Mesh(
  new THREE.BoxGeometry(26, 26, 26),
  new THREE.MeshBasicMaterial({ color: 0xffa53b }),
);
far.position.set(90, FLOOR_Y + 18, -160);
above.add(far);

// ── зеркальные копии ────────────────────────────────────────────────────────
// Отражение плоскости y = FLOOR_Y: масштаб -1 по Y и сдвиг на 2*FLOOR_Y.
// Отражение выворачивает геометрию наизнанку, поэтому у копий отключается
// отбрасывание задних граней, иначе предметы в отражении пропадут.
const below = new THREE.Group();
below.scale.set(1, -1, 1);
below.position.y = 2 * FLOOR_Y;
scene.add(below);

function mirrorOf(src) {
  const copy = src.clone();
  copy.traverse((o) => {
    if (!o.material) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    const cloned = mats.map((m) => {
      const c = m.clone();
      c.side = THREE.DoubleSide;
      c.transparent = true;
      c.opacity = 0.55;   // отражение всегда тусклее оригинала
      c.depthWrite = false;
      return c;
    });
    o.material = Array.isArray(o.material) ? cloned : cloned[0];
  });
  return copy;
}
below.add(mirrorOf(above));

// ── пол ─────────────────────────────────────────────────────────────────────
// Полупрозрачная плоскость поверх копий: она их приглушает и даёт поверхности
// собственный цвет, но не закрывает. Резкой границы нет — к горизонту пол
// растворяется туманом, как требует REFERENCE.md.
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(2400, 2400),
  new THREE.MeshBasicMaterial({
    color: 0x0a1018,
    transparent: true,
    opacity: 0.55,
    depthWrite: false,
  }),
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = FLOOR_Y;
floor.renderOrder = 1;
scene.add(floor);

// Сетка — чтобы читалась сама поверхность и было видно, что вы по ней идёте.
const grid = new THREE.GridHelper(2400, 120, 0x2a5f8f, 0x14304a);
grid.position.y = FLOOR_Y + 0.05;
grid.material.transparent = true;
grid.material.opacity = 0.5;
grid.material.depthWrite = false;
grid.renderOrder = 2;
scene.add(grid);

const flyCam = createFlyCam(camera, canvas);

function resize() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);

// Наружу для проверки из консоли: снять кадр и прочитать пиксели.
window.__probe = { renderer, scene, camera, above, below, floor };

let last = performance.now();
function tick(now) {
  const dt = Math.min(Math.max((now - last) / 1000, 0), 0.1);
  last = now;
  flyCam.update(dt);
  // Под пол не проваливаемся: по полу ходят, а не летают сквозь него.
  if (camera.position.y < FLOOR_Y + 1.5) camera.position.y = FLOOR_Y + 1.5;
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
